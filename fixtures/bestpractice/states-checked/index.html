<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A page whose custom checkbox draws its checked state, so the state probe can judge it, next to a native checkbox it deliberately does not judge."
    />
    <title>Checked state fixture</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 2rem auto;
        max-width: 36rem;
      }
      .custom input {
        appearance: none;
        border: 2px solid #555;
        border-radius: 4px;
        height: 20px;
        width: 20px;
      }
      .custom input:hover {
        border-color: #6cc2a4;
      }
      .custom input:checked {
        background: #1b4d3e;
        border-color: #1b4d3e;
      }
      .custom input:checked:hover {
        background: #24675a;
      }
      .flat input {
        appearance: none;
        border: 2px solid #555;
        border-radius: 4px;
        height: 20px;
        width: 20px;
      }
      .flat input:hover {
        border-color: #6cc2a4;
      }
      /* Deliberately draws nothing for the checked state: the defect this fixture exists to catch. */
      .flat input:checked {
        background: transparent;
        border-color: #555;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Preferences</h1>
      <label class="custom"><input type="checkbox" checked /> Email me receipts</label>
      <label class="flat"><input type="checkbox" /> Newsletter</label>
      <label><input type="checkbox" checked /> Native control, not judged</label>
    </main>
  </body>
</html>
