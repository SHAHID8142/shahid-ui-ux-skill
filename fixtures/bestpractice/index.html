<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best-practice scope fixture</title>
    <!-- No meta description on purpose: a page-level copy defect the scope must not attribute. -->
    <style>
      :root {
        --ink: #1b1b1f;
        --accent: #2c5fa8;
      }
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
      }
      nav {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 12px;
      }
      /* 32x24 on purpose: the second element-level target-size defect in this fixture. */
      .skip {
        display: inline-block;
        width: 32px;
        height: 24px;
        overflow: hidden;
      }
      main {
        padding: 16px;
        max-width: 60ch;
      }
      /* 32x24 on purpose: below the 44 px target size the audit measures. */
      .cta {
        display: inline-block;
        width: 32px;
        height: 24px;
        overflow: hidden;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      input,
      button {
        font: inherit;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main">
      <a id="skip" class="skip" href="#main">Skip to content</a>
      <a href="/about">About</a>
    </nav>
    <main id="main">
      <h1>Scope fixture</h1>
      <p>One undersized call to action, one labelled form, no meta description.</p>
      <a class="cta" id="cta" href="#get" aria-label="Get started">Go</a>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit">Send</button>
      </form>
    </main>
  </body>
</html>
