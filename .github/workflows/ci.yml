name: CI

# Build-phase verification pipeline (protocol §0.5): automated checks on dev
# branches. main is never built here; final private push is T1006.
'on':
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24'] # ADR-006: maintenance LTS + active LTS
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (dist for cross-package gates/typecheck)
        run: pnpm build
      - name: Continuation checker
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: CSS lint (stylelint)
        run: pnpm stylelint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Playwright chromium (browser-dependent tests)
        run: pnpm --filter @sus/eval-core exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm test
      - name: Build fixtures (corpus smoke)
        run: |
          pnpm --filter @sus/fixture-commerce build
          pnpm --filter @sus/fixture-admin build
          pnpm --filter @sus/fixture-portfolio build
          pnpm --filter @sus/fixture-marketing build
