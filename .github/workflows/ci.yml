name: CI

# Build-phase verification pipeline (protocol §0.5): automated checks on dev
# branches — the push trigger ignores main, so nothing builds main here directly
# (a pull_request into main builds that PR's merge commit; branch policy is the
# owner's). The final verified checkpoint push is T1006 (public repository per
# D34; the product itself is not published).
'on':
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24'] # ADR-006: maintenance LTS + active LTS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; reads packageManager from package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (dist for cross-package gates/typecheck)
        run: pnpm build
      - name: Continuation checker
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: CSS lint (stylelint)
        run: pnpm stylelint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Playwright chromium (browser-dependent tests)
        run: pnpm --filter @sus/eval-core exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm test
      - name: Build fixtures (corpus smoke)
        run: |
          pnpm --filter @sus/fixture-commerce build
          pnpm --filter @sus/fixture-admin build
          pnpm --filter @sus/fixture-portfolio build
          pnpm --filter @sus/fixture-marketing build

  # The documented first-run path, on a tree that has never been built (T1011).
  #
  # Why this job exists: the `verify` job above runs `pnpm build` before
  # `pnpm check`, which is correct for a warmed checkout and is exactly what hid a
  # real defect — a pristine clone failed at `pnpm verify` with
  # ERR_MODULE_NOT_FOUND because nothing had built the packages the gate scripts
  # import (T1010). A fresh clone has no dist/ and no node_modules, so this job
  # states only what docs/RESUME_ON_NEW_MACHINE.md tells a person to run. Do not
  # add a build step here: if this job is red, the documented path is broken.
  fresh-clone:
    name: fresh clone (documented first-run path)
    runs-on: ubuntu-latest
    steps:
      # Full history, so `git clone --local` below is a real clone and not a
      # shallow copy: the fresh tree must look like one a person would get.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Clone the same commit into a tree that has never been built
        run: |
          git clone --quiet --local --no-hardlinks . "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f package.json
          test ! -d node_modules
          test ! -d packages/eval-core/dist
      - name: Documented path — pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/fresh
        run: pnpm install --frozen-lockfile
      # Browser *system* libraries are environment, not repository state; the
      # verify job installs them with --with-deps for the same reason.
      - name: Browser system libraries (environment only)
        working-directory: ${{ runner.temp }}/fresh
        run: pnpm --filter @sus/eval-core exec playwright install --with-deps chromium
      - name: Documented path — pnpm setup, then pnpm verify (no manual build)
        working-directory: ${{ runner.temp }}/fresh
        run: |
          pnpm setup
          pnpm verify

  # T0902/T1012: the identical host smoke, run here so the audit entry point is
  # tested by the pipeline and not only by an agent's laptop (issue #13 deliverable
  # 6). It is deliberately its own job: a red smoke means "the entry point does not
  # work", which must not read as one red step among many.
  #
  # What this does and does not prove: it exercises the CLI invocation that exists
  # (`sus-eval audit --mode quick`, no browser needed) and the install round trip on
  # the runner's OS. It does NOT verify a host slash binding — no host is at
  # `supported` (docs/SUPPORT_MATRIX.md), so `/sus audit` stays documented intent.
  host-smoke:
    name: host smoke (8 checks, identical script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the smoke runs the built CLI, not the sources)
        run: pnpm build
      # The script is the assertion: exit 0 means verdict PASS over all 8 checks
      # (`process.exitCode = failed ? 1 : 0`), and it prints the JSON receipt. T1048 (audit
      # finding T1003-3): the receipt is written by redirection, not a `| tee` pipe — GitHub's
      # default run shell is `bash -e` without pipefail, so a pipe would discard the smoke's
      # exit code and this step could never turn red.
      - name: Host smoke (fails the build if any check fails)
        run: node scripts/coord/smoke-host.mjs > "$RUNNER_TEMP/smoke.json"
      - name: Support matrix on this runner is the generated one
        run: pnpm support

  # G13 is the non-waivable critical security/privacy gate (T0806). It runs as
  # its own job so a failure cannot be read as "one red step among many": a
  # hostile-page denial or a privacy leak fails the build on its own.
  security:
    name: security suite (G13 — never waivable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (dist for the gate checks)
        run: pnpm build
      - name: Hostile-page denial + privacy suite (docs/THREAT_MODEL.md)
        run: pnpm --filter @sus/studio-bridge exec vitest run tests/security.test.ts
      - name: G13 fail-closed negatives
        run: node scripts/check-gates.mjs
      - name: Threat model is present
        run: test -s docs/THREAT_MODEL.md
